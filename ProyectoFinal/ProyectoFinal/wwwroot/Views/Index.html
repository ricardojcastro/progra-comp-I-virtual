    <script>
        document.addEventListener("DOMContentLoaded", event => {
            mnxPelicula.addEventListener("click", e => {
                e.preventDefault();

                abrirVentana(e.target.dataset.form);
            });
        });
        function abrirVentana(form) {
            let $form = $(`#${form}`)
            if ($form.find("form").length > 0) {
                $form.show();
            } else {
                let url = `/views/${form}.html`;
                fetch(url).then(resp.text()).then(vista => {
                    $(`#${form}`).html(vista);
                    cerrarVentana();
                });
            }

        }
        function cerrarVentana() {
            $(".btn-close").click(e => {
                let form = e.target.dataset.form;
                $(`#${form}`).hide();
            })
        }
