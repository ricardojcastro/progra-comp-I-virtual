<form id="frmAlquiler" data-idAlquiler="0" data-accion="nueva">
    <div class="card text-bg-dark mb-3" style="min-width: 500px;">
        <div class="card-header">
            <div class="d-flex">
                Registro de Alquiler
                <div class="ms-auto">
                    <button type="button" data-form="alquiler" class="btn-close btn-close-white"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row p-1">
                <div class="col-3 col-md-2">PELICULA:</div>
                <div class="col-9 col-md-8">
                    <input type="text" class="form-control" id="txtPeliculaAlquiler" name="txtPeliculaAlquiler" required />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">RESPONSABLE:</div>
                <div class="col-9 col-md-8">
                    <input type="text" class="form-control" id="txtResponsableAlquiler" name="txtResponsableAlquiler" required />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">DUI:</div>
                <div class="col-9 col-md-8">
                    <input type="text" class="form-control" id="txtDuiAlquiler" name="txtDuiAlquiler" required />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">DIRECCION:</div>
                <div class="col-9 col-md-10">
                    <input type="text" class="form-control" id="txtDireccionAlquiler" name="txtDireccionAlquiler" required />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">TELEFONO:</div>
                <div class="col-9 col-md-4">
                    <input type="text" class="form-control" id="txtTelefonoAlquiler" name="txtTelefonoAlquiler" required />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">FOTO:</div>
                <div class="col-9 col-md-8">
                    <div class="mb-3">
                        <label for="imgFotoAlquiler" class="form-label">Selecione una imagen</label>
                        <input onchange="seleccionarFotoAlquiler(this)" class="form-control" type="file" id="imgFotoAlquiler" accept="image/*">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-3 col-md-2">
            <img height="10" src="" class="img-thumbnail rounded" alt="Foto del alquiler" id="imgMostrarFotoalquiler">
        </div>
    </div>
    <div class="row p-1">
        <div class="col-12 text-center">
            <input type="submit" class="btn btn-primary" value="Guardar" />
            <input type="reset" class="btn btn-warning" value="Nuevo" />
            <input type="button" onclick="abrirVentana('busqueda_alquiler')" class="btn btn-success" value="Buscar" />
        </div>
    </div>
</form>
<script>
    var archivo;
    async function seleccionarFotoalquiler(file) {
        let img = $(file)[0]?.files[0] || null;
        if (img) {
            archivo = await procesarImg(img);
            $("#imgMostrarFotoAlquiler").attr("src", archivo);
        }
    }
    function procesarImg(img) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(img);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }
    frmCliente.addEventListener('submit', e => {
        e.preventDefault();
        guadarAlquiler();
    });
    frmCliente.addEventListener('reset', e => {
        e.preventDefault();
        nuevoAlquiler();
    });
    async function guadarAlquiler() {
        let datos = {
            pelicula: txtpeliculaAlquiler.value,
            responsable: txtResponsable.Alquiler.value,
            dui: txtDuiAlquiler.value,
            direccion: txtDireccionAlquiler.value,
            telefono: txtTelefonoAlquiler,
            foto: archivo.split(',')[1] || null,
        },
            method = "POST",
            url = 'https://localhost:7130/api/Clientes';
        if (frmCliente.dataset.accion == "modificar") {
            datos.idAlquiler = frmAlquiler.dataset.idAlquiler;
            method = "PUT";
            url = `https://localhost:7130/api/Clientes/${datos.idAlquiler}`;
        }
        const respuesta = await fetch(url, {
            method,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(datos)
        }), alquiler = await respuesta.json();
        if (alquiler && alquiler?.idAlquiler > 0) {
            nuevoAlquiler();
            listarAlquiler();
        } else {
            console.error(Alquiler);
        }
    }
    function modificarAlquiler(alquiler) {
        frmAlquiler.dataset.idAlquiler = alquiler.idAlquiler;
        frmAlquiler.dataset.accion = "modificar";
        txtPeliculaAlquiler.value = alquiler.pelicula;
        txtResponsableAlquiler.value = alquiler.responsable;
        txtDuiAlquiler.value = alquiler.dui;
        txtDireccionAlquiler.value = alquiler.direccion;
        txtTelefonoAlquiler.value = alquiler.telefono;
        archivo = 'data:image/png;base64,' + alquiler.foto;
        $("#imgMostrarFotoAlquiler").attr("src", archivo);
    }
    function nuevoAlquiler() {
        frmAlquiler.dataset.idAlquiler = "0";
        frmAlquiler.dataset.accion = "nuevo";
        txtPeliculaALquiler.value = "";
        txtResponsableALquiler.value = "";
        txtDuialquiler.value = "";
        txtDireccionAlquiler.value = "";
        txtTelefonoAlquiler.value = "";
        archivo = null;
    }
</script>
