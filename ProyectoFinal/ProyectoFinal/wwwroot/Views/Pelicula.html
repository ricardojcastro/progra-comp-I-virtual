<form id="frmPelicula" data-idpelicula="0" data-accion="nueva">
    <div class="card text-bg-dark mb-3" style="min-width: 500px;">
        <div class="card-header">
            <div class="d-flex">
                Registro de peliculas
                <div class="ms-auto">
                    <button type="button" data-form="pelicula" class="btn-close btn-close-white"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row p-1">
                <div class="col-3 col-md-2">TITULO:</div>
                <div class="col-9 col-md-8">
                    <input type="text" class="form-control" id="txtTituloPelicula" name="txtTituloPelicula" required />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">AUTOR:</div>
                <div class="col-9 col-md-8">
                    <input type="text" class="form-control" id="txtAutorPelicula" name="txtAutorPelicula" required />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">SINOPSIS:</div>
                <div class="col-9 col-md-10">
                    <input type="text" class="form-control" id="txtSinopsisPelicula" name="txtSinopsisPelicula" required />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">DURACION:</div>
                <div class="col-9 col-md-4">
                    <input type="text" class="form-control" id="txtDuracionPelicula" name="txtDuracionPelicula" required />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">CLASIFICACION:</div>
                <div class="col-9 col-md-4">
                    <input type="text" class="form-control" id="txtClasificacionPelicula" name="txtClasificacionPelicula" required />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">FOTO:</div>
                <div class="col-9 col-md-8">
                    <div class="mb-3">
                        <label for="imgFotoPelicula" class="form-label">Selecione una imagen</label>
                        <input onchange="seleccionarFotoPelicula(this)" class="form-control" type="file" id="imgFotopelicula" accept="image/*">
                    </div>
                </div>
            </div>
        </div>
        <div class="col-3 col-md-2">
            <img height="10" src="" class="img-thumbnail rounded" alt="Foto de la pelicula" id="imgMostrarFotopelicula">
        </div>
    </div>
    <div class="row p-1">
        <div class="col-12 text-center">
            <input type="submit" class="btn btn-primary" value="Guardar" />
            <input type="reset" class="btn btn-warning" value="Nuevo" />
            <input type="button" onclick="abrirVentana('busqueda_pelicula')" class="btn btn-success" value="Buscar" />
        </div>
    </div>
</form>
<script>
    var archivo;
    async function seleccionarFotoPelicula(file) {
        let img = $(file)[0]?.files[0] || null;
        if (img) {
            archivo = await procesarImg(img);
            $("#imgMostrarFotoPelicula").attr("src", archivo);
        }
    }
    function procesarImg(img) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(img);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }
    frmPelicula.addEventListener('submit', e => {
        e.preventDefault();
        guadarPelicula();
    });
    frmPelicula.addEventListener('reset', e => {
        e.preventDefault();
        nuevaPelicula();
    });
    async function guadarPelicula() {
        let datos = {
            titulo: txtTituloPelicula.value,
            autor: txtAutorPelicula.value,
            sinopsis: txtSinopsisPelicula.value,
            duracion: txtDuracionPelicula.value,
            clasificacion: txtClasificacionPelicuLa.value,
            foto: archivo.split(',')[1] || null,
        },
            method = "POST",
            url = 'https://localhost:7130/api/Peliculas';
        if (frmPelicula.dataset.accion == "modificar") {
            datos.idPeliculas = frmPelicula.dataset.idPeliculas;
            method = "PUT";
            url = `https://localhost:7130/api/Peliculas/${datos.idPeliculas}`;
        }
        const respuesta = await fetch(url, {
            method,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(datos)
        }), pelicula = await respuesta.json();
        if (pelicula && pelicula?.idPeliculas > 0) {
            nuevaPelicula();
            listarPeliculas();
        } else {
            console.error(pelicula);
        }
    }
    function modificarPelicula(pelicula) {
        frmPelicula.dataset.idPeliculas = pelicula.idPeliculas;
        frmPelicula.dataset.accion = "modificar";
        txtTituloPelicula.value = pelicula.titulo;
        txtAutorPelicula.value = pelicula.autor;
        txtSinpsisPelicula.value = pelicula.sinopsis;
        txtDuracionPelicula.value = pelicula.duracion;
        txtClasificacionPelicuLa.value = pelicula.clasificacion;
        archivo = 'data:image/png;base64,' + pelicula.foto;
        $("#imgMostrarFotoCliente").attr("src", archivo);
    }
    function nuevaPelicula() {
        frmPelicula.dataset.idPeliculas = "0";
        frmPelicula.dataset.accion = "nuevo";
        txtTituloPelicula.value = "";
        txtAutorPelicula.value = "";
        txtSinpsisPelicula.value = "";
        txtDuracionpelicula.value = "";
        txtClasificacionpelicula.value = "";
        archivo = null;
    }
</script>
